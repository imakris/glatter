name: CI Windows

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Install pytest
        run: python -m pip install pytest

      - name: Configure CMake
        run: cmake -B build -S . -A x64

      - name: Build with CMake
        run: cmake --build build --config Release

      # The smoke tests execute the programs they compile, and MinGW binaries
      # import libwinpthread-1.dll from the compiler's own bin directory.
      - name: Put the MinGW runtime on PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin'

      - name: Run build smoke tests
        env:
          CC: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe
          CXX: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\g++.exe
        run: python -m pytest tests/test_build.py
